  function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = Math.PI / 180;
    const dLat = (lat2 - lat1) * toRad;
    const dLon = (lon2 - lon1) * toRad;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return Math.round(R * c);
  }

  function formatDistanceText(meters) {
    if (meters === null || meters === undefined) return '';
    if (meters < 1000) return `${meters} m`;
    return `${(meters / 1000).toFixed(2)} km`;
  }

  function triggerBrowserDownload(content, filename, mimeType) {
    let finalContent = content;
    // Add UTF-8 BOM so Microsoft Excel and Google Sheets accurately read UTF-8 characters
    if (mimeType.includes('csv') && !finalContent.startsWith('\uFEFF')) {
      finalContent = '\uFEFF' + finalContent;
    }

    // Try Data URI first: on Chromium with local file:/// pages, Blob URLs lose their download filename
    // and become raw UUIDs like 225cf222-714e-4db6-811a...
    try {
      const dataUri = 'data:' + mimeType + ',' + encodeURIComponent(finalContent);
      const a = document.createElement('a');
      a.href = dataUri;
      a.setAttribute('download', filename);
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        if (document.body.contains(a)) document.body.removeChild(a);
      }, 150);
      return;
    } catch (err) {
      console.warn('Data URI download fallback to Blob:', err);
    }

    // Fallback for massive payloads
    const blob = new Blob([finalContent], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      if (document.body.contains(a)) document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 150);
  }

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.style.padding = '10px 16px';
    toast.style.borderRadius = '6px';
    toast.style.fontSize = '12px';
    toast.style.fontWeight = '600';
    toast.style.boxShadow = '0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1)';
    toast.style.transition = 'all 0.2s ease';
    toast.style.maxWidth = '360px';

    if (type === 'success') {
      toast.style.background = '#059669';
      toast.style.color = '#ffffff';
    } else if (type === 'error') {
      toast.style.background = '#dc2626';
      toast.style.color = '#ffffff';
    } else if (type === 'warning') {
      toast.style.background = '#d97706';
      toast.style.color = '#ffffff';
    } else {
      toast.style.background = '#0b1329';
      toast.style.color = '#ffffff';
    }

    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(10px)';
      setTimeout(() => toast.remove(), 250);
    }, 3500);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function truncate(str, len) {
    if (!str) return '';
    if (str.length <= len) return str;
    return str.substring(0, len) + '...';
  }

  function getTimestampStr() {
    const d = new Date();
    return d.toISOString().replace(/[:.]/g, '-').slice(0, 19);
  }

  function saveActiveApiKey() {
    const input = document.getElementById('input-custom-api-key');
    if (!input || !input.value.trim()) {
      showToast('Please enter a valid Google Maps API Key.', 'warning');
      return;
    }
    const newKey = input.value.trim();
    if (/^\d+$/.test(newKey)) {
      showToast('⚠️ "' + newKey + '" is a Google Cloud Project Number, NOT an API Key! API keys begin with "AIzaSy".', 'error');
      const feedback = document.getElementById('api-key-test-feedback');
      if (feedback) {
        feedback.style.display = 'block';
        feedback.style.background = '#fef2f2';
        feedback.style.color = '#991b1b';
        feedback.style.border = '1px solid #fecaca';
        feedback.innerHTML = '❌ <b>Invalid Key Format:</b> <code>' + escapeHtml(newKey) + '</code> is a <b>Google Cloud Project Number</b>, not an API Key.<br>Google Places API keys always start with <code>AIzaSy...</code>.<br>👉 Find your API Key in Google Cloud Console under <b>APIs & Services ➔ Credentials</b>.';
      }
      return;
    }
    if (!newKey.startsWith('AIza')) {
      showToast('Note: Google API keys typically begin with "AIza". Saving...', 'info');
    }

    localStorage.setItem('GMAPS_ACTIVE_API_KEY', newKey);
    
    // Also save in Apps Script properties if available
    try {
      if (window.google && window.google.script && window.google.script.run && window.google.script.run.saveCustomApiKey) {
        google.script.run.saveCustomApiKey(newKey);
      }
    } catch(e) {}

    showToast('API Key updated! Testing live quota...', 'success');
    testCurrentApiKey();
  }

  function testCurrentApiKey() {
    const input = document.getElementById('input-custom-api-key');
    const feedback = document.getElementById('api-key-test-feedback');
    const keyToTest = (input && input.value.trim()) ? input.value.trim() : (localStorage.getItem('GMAPS_ACTIVE_API_KEY') || '');

    if (!keyToTest) {
      if (feedback) {
        feedback.style.display = 'block';
        feedback.style.background = '#fef2f2';
        feedback.style.color = '#991b1b';
        feedback.style.border = '1px solid #fecaca';
        feedback.textContent = 'No API Key is currently entered. Please paste your Google Places API Key above.';
      }
      updateHeaderStatus({ status: 'missing' });
      return;
    }

    if (feedback) {
      feedback.style.display = 'block';
      feedback.style.background = '#f1f5f9';
      feedback.style.color = '#334155';
      feedback.style.border = '1px solid #cbd5e1';
      feedback.textContent = 'Testing API Key with Google Places API (New)...';
    }

    // Test Places API (New) Autocomplete
    fetch('https://places.googleapis.com/v1/places:autocomplete', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': keyToTest
      },
      body: JSON.stringify({ input: 'Tata Motors Pune', includedRegionCodes: ['IN'] })
    })
    .then(res => res.json().then(data => ({ status: res.status, ok: res.ok, data: data })))
    .then(result => {
      if (!feedback) return;
      if (result.ok && result.data && result.data.suggestions && result.data.suggestions.length > 0) {
        feedback.style.background = '#ecfdf5';
        feedback.style.color = '#065f46';
        feedback.style.border = '1px solid #a7f3d0';
        const matchTitle = result.data.suggestions[0].placePrediction.text.text;
        feedback.innerHTML = `✅ <b>Google Places API (New) is Active & Verified!</b><br>Live verified match: "${escapeHtml(matchTitle)}".`;
        showToast('API Key verified: Active & working live!', 'success');
        updateHeaderStatus({ status: 'active' });
      } else if (result.data && result.data.error) {
        const err = result.data.error;
        if (err.status === 'RESOURCE_EXHAUSTED' || (err.message && err.message.includes('Quota exceeded'))) {
          feedback.style.background = '#fef2f2';
          feedback.style.color = '#991b1b';
          feedback.style.border = '1px solid #fecaca';
          feedback.innerHTML = `⚠️ <b>Quota Limit Reached:</b> ${escapeHtml(err.message)}`;
          updateHeaderStatus({ status: 'quota' });
        } else {
          feedback.style.background = '#fef2f2';
          feedback.style.color = '#991b1b';
          feedback.style.border = '1px solid #fecaca';
          feedback.innerHTML = `❌ <b>Google Error (${err.status || result.status}):</b> ${escapeHtml(err.message)}`;
          updateHeaderStatus({ status: 'error', text: err.message });
        }
      } else {
        feedback.style.background = '#ecfdf5';
        feedback.style.color = '#065f46';
        feedback.style.border = '1px solid #a7f3d0';
        feedback.innerHTML = `✅ <b>API Key is Connected to Google Places Platform.</b>`;
        updateHeaderStatus({ status: 'active' });
      }
    })
    .catch(err => {
      if (feedback) {
        feedback.style.background = '#fef2f2';
        feedback.style.color = '#991b1b';
        feedback.style.border = '1px solid #fecaca';
        feedback.textContent = 'Connection error: ' + err.message;
      }
      updateHeaderStatus({ status: 'error', text: 'Connection Error' });
    });
  }

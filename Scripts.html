  // ============================================================================
  // G-MAPS INDUSTRIAL COMPANY FINDER — CLIENT-SIDE CONTROLLER
  // Production-Ready Controller with 6 Action Cards, End-to-End Search,
  // Source Transparency, and Strict 1 km Haversine Perimeter Enforcement
  // ============================================================================

  const App = {
    // Location state
    confirmedLocation: null,
    locationSuggestions: [],
    searchRadius: 3000, // Default 3 km for Indian MSMEs & industrial clusters
    
    // Data state
    companies: [],
    filteredCompanies: [],
    keywords: [],
    savedSearches: [],
    metrics: {},
    spreadsheetUrl: '',
    currentSearchId: '',
    selectedCompany: null,
    activeSectorFilter: null,
    
    // UI state
    isSearching: false,
    searchQuery: '',
    relevanceFilter: 'ALL',
    tierFilter: 'ALL',
    pagination: {
      page: 1,
      pageSize: 20,
      total: 0,
      totalPages: 1
    },
    
    // Maps state
    map: null,
    mapMarker: null,
    mapCircle: null,
    companyMarkers: [],
    activeInfoWindow: null
  };

  // Global fallback callback for map initialization
  window.initGoogleMap = function() {
    initMap();
  };

  // ----------------------------------------------------------------------------
  // INITIALIZATION & LIFECYCLE
  // ----------------------------------------------------------------------------
  document.addEventListener('DOMContentLoaded', () => {
    initApp();
  });

  function initApp() {
    try {
      const cachedKey = localStorage.getItem('GMAPS_ACTIVE_API_KEY');
      // Remove obviously invalid/old keys from storage but do NOT auto-populate a hardcoded key
      if (cachedKey && (cachedKey.includes('BCBas') || cachedKey.length < 25)) {
        localStorage.removeItem('GMAPS_ACTIVE_API_KEY');
      }
    } catch (e) {}

    setupLocationSearchInput();
    setupTableFilterInput();
    initMap();
    loadInitialServerData();
  }

  function loadInitialServerData() {
    showToast('Connecting to Industrial Intelligence database...', 'info');

    google.script.run
      .withSuccessHandler((data) => {
        App.keywords = data.keywords || [];
        App.spreadsheetUrl = data.spreadsheetUrl || '';
        App.metrics = data.metrics || {};
        App.savedSearches = data.recentSessions || [];

        updateHeaderStatus(data.environment);
        updateDiagnostics(data.environment);

        // Initialize Map
        initMap();

        // Load existing companies from database
        loadCompanies();
      })
      .withFailureHandler((err) => {
        showToast('Database connection error: ' + err.message, 'error');
        updateHeaderStatus({ isReady: false, issues: [err.message] });
        initMap();
      })
      .getInitialData();
  }

  function updateHeaderStatus(statusInfo) {
    const statusPill = document.getElementById('header-api-status');
    if (!statusPill) return;

    if (typeof statusInfo === 'object' && statusInfo.status) {
      if (statusInfo.status === 'active') {
        statusPill.className = 'status-badge active';
        statusPill.innerHTML = '<span class="status-indicator" style="background:#059669;"></span> Google Places API Connected';
      } else if (statusInfo.status === 'quota') {
        statusPill.className = 'status-badge warning';
        statusPill.innerHTML = '<span class="status-indicator" style="background:#f59e0b;"></span> ⚠️ Daily Quota Limit (429)';
      } else if (statusInfo.status === 'error') {
        statusPill.className = 'status-badge warning';
        statusPill.innerHTML = '<span class="status-indicator" style="background:#dc2626;"></span> ❌ ' + escapeHtml(statusInfo.text || 'API Error');
      } else {
        statusPill.className = 'status-badge warning';
        statusPill.innerHTML = '<span class="status-indicator" style="background:#dc2626;"></span> Places API Key Required';
      }
      return;
    }

    if (statusInfo && statusInfo.hasPlacesApiKey) {
      statusPill.className = 'status-badge active';
      statusPill.innerHTML = '<span class="status-indicator"></span> Google Places API Connected';
    } else {
      statusPill.className = 'status-badge warning';
      statusPill.innerHTML = '<span class="status-indicator" style="background:#dc2626;"></span> Places API Key Required';
    }
  }

  function updateDiagnostics(env) {
    const placesDiag = document.getElementById('diag-places-status');
    const jsKeyDiag = document.getElementById('diag-js-key-status');
    const sheetDiag = document.getElementById('diag-sheets-status');

    if (placesDiag) {
      placesDiag.textContent = (env && env.hasPlacesApiKey) ? 'Active & Configured' : 'Missing PLACES_API_KEY';
      placesDiag.style.color = (env && env.hasPlacesApiKey) ? '#059669' : '#dc2626';
    }
    if (jsKeyDiag) {
      jsKeyDiag.textContent = (env && env.hasMapsJsApiKey) ? 'Loaded' : 'Vector Radar Active';
    }
    if (sheetDiag) {
      sheetDiag.textContent = (env && env.spreadsheetId) ? 'Connected' : 'Workspace Google Sheet';
    }
  }

  // ----------------------------------------------------------------------------
  // PART A: SIX REAL INTERACTIVE ACTION CARDS
  // ----------------------------------------------------------------------------
  function handleActionCard(actionType) {
    switch (actionType) {
      case 'NEARBY':
        // Card 1: Find Nearby Industries -> Focus search input & highlight search button
        const secLoc = document.getElementById('section-location');
        const locInput = document.getElementById('location-search-input');
        if (secLoc) secLoc.scrollIntoView({ behavior: 'smooth' });
        if (locInput) {
          locInput.focus();
          showToast('Enter a company, locality or area to search 1 km around it.', 'info');
        }
        break;

      case 'SECTORS':
        // Card 2: Explore Industrial Sectors -> Open sectors modal
        openSectorsModal();
        break;

      case 'VERIFY':
        // Card 3: Verify Company Details -> Filter table to unverified / needs review queue
        const relFilter = document.getElementById('filter-relevance');
        if (relFilter) {
          relFilter.value = 'REVIEW';
          App.relevanceFilter = 'REVIEW';
        }
        applyTableFilters();
        const secRes = document.getElementById('section-results');
        if (secRes) secRes.scrollIntoView({ behavior: 'smooth' });
        showToast('Filtered table to companies needing review or verification.', 'info');
        break;

      case 'AREA':
        // Card 4: Explore Search Area -> Scroll to map and coordinates
        const mapContainer = document.getElementById('location-map-container');
        if (mapContainer) {
          mapContainer.scrollIntoView({ behavior: 'smooth' });
          mapContainer.style.outline = '3px solid #2563eb';
          setTimeout(() => { mapContainer.style.outline = 'none'; }, 2000);
        }
        const coordsText = App.confirmedLocation ? `${App.confirmedLocation.latitude.toFixed(4)}, ${App.confirmedLocation.longitude.toFixed(4)}` : 'Enter a location to view coordinates';
        showToast(`Search Area: 1,000 metres circle perimeter. Centre: ${coordsText}`, 'info');
        break;

      case 'HISTORY':
        // Card 5: Previous Searches -> Open search history modal
        openHistoryModal();
        break;

      case 'EXPORT':
        // Card 6: Export Company Data -> Open export options modal
        openExportModal();
        break;
    }
  }

  // MODAL 1: INDUSTRIAL SECTORS
  function openSectorsModal() {
    const modal = document.getElementById('sectors-modal');
    const backdrop = document.getElementById('sectors-modal-backdrop');
    const container = document.getElementById('sectors-list-container');

    // Aggregate sectors from loaded companies or use standard library
    const sectorCounts = {};
    const defaultSectors = [
      'Machinery & Tools',
      'Metal & Fabrication',
      'Automotive & Components',
      'Electrical & Electronics',
      'Chemicals & Polymers',
      'Automation & Robotics',
      'Plastics & Moulds',
      'Packaging & Containers',
      'General Manufacturing'
    ];

    defaultSectors.forEach(s => { sectorCounts[s] = 0; });
    App.companies.forEach(c => {
      const s = c.industrial_sector || 'General Manufacturing';
      sectorCounts[s] = (sectorCounts[s] || 0) + 1;
    });

    let html = '';
    Object.keys(sectorCounts).forEach(sector => {
      const count = sectorCounts[sector];
      const isSelected = (App.activeSectorFilter === sector);
      html += `
        <div 
          onclick="filterBySector('${escapeHtml(sector)}')"
          style="padding: 12px; border: 1px solid ${isSelected ? 'var(--brand-blue)' : 'var(--border-subtle)'}; background: ${isSelected ? 'var(--brand-blue-light)' : '#f8fafc'}; border-radius: var(--radius-md); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s ease;"
        >
          <div>
            <div style="font-weight: 700; font-size: 12px; color: var(--text-primary);">${escapeHtml(sector)}</div>
            <div style="font-size: 11px; color: var(--text-secondary);">${count} verified companies</div>
          </div>
          <span style="font-size: 11px; font-weight: 700; color: var(--brand-blue);">Select ➔</span>
        </div>
      `;
    });

    if (container) container.innerHTML = html;
    if (modal) modal.style.display = 'flex';
    if (backdrop) backdrop.classList.add('active');
  }

  function closeSectorsModal() {
    const modal = document.getElementById('sectors-modal');
    const backdrop = document.getElementById('sectors-modal-backdrop');
    if (modal) modal.style.display = 'none';
    if (backdrop) backdrop.classList.remove('active');
  }

  function filterBySector(sector) {
    App.activeSectorFilter = sector;
    closeSectorsModal();

    // Filter table by sector
    const input = document.getElementById('table-filter-input');
    if (input) input.value = sector;
    App.searchQuery = sector.toLowerCase();
    App.pagination.page = 1;
    applyTableFilters();

    const secRes = document.getElementById('section-results');
    if (secRes) secRes.scrollIntoView({ behavior: 'smooth' });
    showToast(`Filtered companies by sector: ${sector}`, 'info');
  }

  function clearSectorFilter() {
    App.activeSectorFilter = null;
    closeSectorsModal();
    const input = document.getElementById('table-filter-input');
    if (input) input.value = '';
    App.searchQuery = '';
    App.pagination.page = 1;
    applyTableFilters();
    showToast('Cleared sector filter.', 'info');
  }

  // MODAL 2: SEARCH SESSIONS HISTORY
  function openHistoryModal() {
    const modal = document.getElementById('history-modal');
    const backdrop = document.getElementById('history-modal-backdrop');
    const container = document.getElementById('history-list-container');

    if (modal) modal.style.display = 'flex';
    if (backdrop) backdrop.classList.add('active');

    if (container) {
      container.innerHTML = '<div style="text-align:center; padding:24px; color:var(--text-secondary);">Loading search history from Google Sheets...</div>';
    }

    google.script.run
      .withSuccessHandler((sessions) => {
        if (!container) return;
        App.savedSearches = sessions || [];

        if (!sessions || sessions.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding:32px 16px; color:var(--text-secondary);">
              <div style="font-size:28px; margin-bottom:8px;">🕒</div>
              <div style="font-weight:700; color:var(--text-primary); margin-bottom:4px;">No Previous Searches Recorded Yet</div>
              <div style="font-size:12px; color:var(--text-muted); max-width:400px; margin:0 auto;">
                When you run a 1 km search, the search session parameters and company coverage metrics will be automatically archived to Google Sheets.
              </div>
            </div>
          `;
          return;
        }

        let html = '';
        sessions.slice(0, 10).forEach(s => {
          const dt = s.search_timestamp ? new Date(s.search_timestamp).toLocaleString() : 'Recent';
          html += `
            <div style="border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:12px 14px; background:#f8fafc; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <div>
                <div style="font-weight:700; font-size:13px; color:var(--text-primary);">${escapeHtml(s.area_display_name || s.session_name || 'Industrial Search')}</div>
                <div style="font-size:11px; color:var(--text-secondary);">
                  Session ID: <code>${escapeHtml(s.session_id)}</code> • Date: ${dt}
                </div>
                <div style="font-size:11px; color:var(--brand-blue); margin-top:2px;">
                  Discovered: <b>${s.new_companies_added || 0} companies</b> • Raw Scanned: ${s.total_raw_found || 0} • Duplicates Filtered: ${s.duplicates_prevented || 0}
                </div>
              </div>
              <span class="source-pill live">Archived in Sheets</span>
            </div>
          `;
        });
        container.innerHTML = html;
      })
      .withFailureHandler((err) => {
        if (container) {
          container.innerHTML = `<div style="color:var(--status-danger); padding:16px;">Failed to load history: ${escapeHtml(err.message)}</div>`;
        }
      })
      .getSavedSearches();
  }

  function closeHistoryModal() {
    const modal = document.getElementById('history-modal');
    const backdrop = document.getElementById('history-modal-backdrop');
    if (modal) modal.style.display = 'none';
    if (backdrop) backdrop.classList.remove('active');
  }

  // MODAL 3: EXPORT OPTIONS
  function openExportModal() {
    const modal = document.getElementById('export-modal');
    const backdrop = document.getElementById('export-modal-backdrop');

    if (backdrop) backdrop.classList.add('active');
  }

  function closeExportModal() {
    const modal = document.getElementById('export-modal');
    const backdrop = document.getElementById('export-modal-backdrop');
    if (modal) modal.style.display = 'none';
    if (backdrop) backdrop.classList.remove('active');
  }

  // MODAL 4: GOOGLE SPREADSHEET MANAGER & EXPORTS
  function handleOpenGoogleSpreadsheet() {
    if (App.spreadsheetUrl && App.spreadsheetUrl.trim() !== '' && !App.spreadsheetUrl.includes('<?=') && !App.spreadsheetUrl.includes('undefined')) {
      window.open(App.spreadsheetUrl, '_blank');
      showToast('Opening connected Google Spreadsheet in new tab...', 'info');
      return;
    }
    openSpreadsheetModal();
  }

  function openSpreadsheetModal() {
    const modal = document.getElementById('spreadsheet-modal');
    const backdrop = document.getElementById('spreadsheet-modal-backdrop');
    if (modal) modal.style.display = 'block';
    if (backdrop) backdrop.classList.add('active');

    const input = document.getElementById('input-spreadsheet-url');
    const status = document.getElementById('connected-sheet-status');
    if (input) {
      input.value = (App.spreadsheetUrl && !App.spreadsheetUrl.includes('<?=')) ? App.spreadsheetUrl : '';
    }
    if (status) {
      if (App.spreadsheetUrl && !App.spreadsheetUrl.includes('<?=')) {
        status.textContent = 'Currently connected: ' + App.spreadsheetUrl;
      } else {
        status.textContent = 'No custom Google Spreadsheet linked yet. Click Option 1 to create one or enter ID below.';
      }
    }
  }

  function closeSpreadsheetModal() {
    const modal = document.getElementById('spreadsheet-modal');
    const backdrop = document.getElementById('spreadsheet-modal-backdrop');
    if (modal) modal.style.display = 'none';
    if (backdrop) backdrop.classList.remove('active');
  }

  function saveConnectedSpreadsheet() {
    const input = document.getElementById('input-spreadsheet-url');
    if (!input) return;
    const val = input.value.trim();
    if (!val) {
      showToast('Please enter a valid Google Spreadsheet URL or ID.', 'warning');
      return;
    }

    let cleanUrl = val;
    if (!val.startsWith('http')) {
      cleanUrl = `https://docs.google.com/spreadsheets/d/${val}/edit`;
    }

    App.spreadsheetUrl = cleanUrl;
    showToast('Google Spreadsheet linked: ' + cleanUrl, 'success');

    const status = document.getElementById('connected-sheet-status');
    if (status) status.textContent = 'Linked: ' + cleanUrl;

    const sheetDiag = document.getElementById('diag-sheets-status');
    if (sheetDiag) sheetDiag.textContent = 'Connected';

    try {
      localStorage.setItem('GMAPS_SPREADSHEET_URL', cleanUrl);
    } catch(e) {}

    setTimeout(() => {
      closeSpreadsheetModal();
      window.open(cleanUrl, '_blank');
    }, 600);
  }

  // MSME RADIUS SELECTOR (1 km, 3 km, 5 km, 10 km)
  function setSearchRadius(meters) {
    App.searchRadius = meters;
    
    // Update active button state
    document.querySelectorAll('.radius-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.getElementById('rad-btn-' + meters);
    if (activeBtn) activeBtn.classList.add('active');

    // Update Section B badges
    const displayRadius = document.getElementById('display-search-radius');
    const displayPerimeter = document.getElementById('display-radius-perimeter');
    const kmStr = (meters / 1000).toFixed(meters % 1000 === 0 ? 0 : 1) + ' km (' + meters.toLocaleString() + ' m)';
    if (displayRadius) displayRadius.textContent = kmStr;
    if (displayPerimeter) displayPerimeter.textContent = 'Verified ≤ ' + meters.toLocaleString() + ' m';

    // Update map badge
    const mapRadText = document.getElementById('map-radius-text');
    if (mapRadText) mapRadText.textContent = meters.toLocaleString() + ' metres (' + (meters / 1000) + ' km) circle perimeter';

    // Update map circle radius
    if (App.mapCircle && App.mapCircle.setRadius) {
      App.mapCircle.setRadius(meters);
      if (App.map && App.confirmedLocation) {
        const zoom = (meters <= 1000) ? 14 : ((meters <= 3000) ? 13 : ((meters <= 5000) ? 12 : 11));
        App.map.setZoom(zoom);
      }
    }

    updateDashboardKPIs();

    // Immediately re-filter if results already loaded
    const cLat = (App.confirmedLocation && App.confirmedLocation.latitude) || null;
    const cLng = (App.confirmedLocation && App.confirmedLocation.longitude) || null;
    if (cLat !== null && cLng !== null && App.rawDiscoveredCompanies && App.rawDiscoveredCompanies.length > 0) {
      App.companies = App.rawDiscoveredCompanies.filter(c => {
        if (c.is_search_center) {
          c.distance_meters = 0;
          c.distance_text = '0 m (Search Target)';
          return true;
        }
        const d = calculateHaversineDistance(cLat, cLng, c.latitude, c.longitude);
        c.distance_meters = d;
        c.distance_text = formatDistanceText(d);
        return d <= meters && isStrictlyIndustrial(c.company_name, c.industrial_sector, c.primary_type);
      });
      App.companies.sort((a, b) => (a.distance_meters || 0) - (b.distance_meters || 0));
      applyTableFilters();
      const countBadge = document.getElementById('results-count-badge');
      if (countBadge) countBadge.textContent = `${App.companies.length} Companies (${(meters/1000)} km)`;
      showToast(`Radius perimeter applied: ${App.companies.length} verified companies within ${meters/1000} km.`, 'info');
    } else {
      showToast(`Search radius updated to ${meters / 1000} km (${meters} m) for Indian MSMEs & Industries`, 'info');
    }
  }

  // ----------------------------------------------------------------------------
  // SECTION A: LOCATION SEARCH & RESOLUTION
  // ----------------------------------------------------------------------------
  function setupLocationSearchInput() {
    const input = document.getElementById('location-search-input');
    if (!input) return;

    let debounceTimer = null;
    const triggerSuggestions = () => {
      const q = input.value.trim();
      clearTimeout(debounceTimer);

      if (q.length < 2) {
        hideLocationSuggestions();
        return;
      }

      debounceTimer = setTimeout(() => {
        fetchLocationSuggestions(q);
      }, 150);
    };

    input.addEventListener('input', triggerSuggestions);
    input.addEventListener('focus', triggerSuggestions);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        // If Enter is pressed, resolve and trigger 1 km search seamlessly
        execute1KmIndustrialSearch();
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.location-search-box')) {
        hideLocationSuggestions();
      }
    });
  }

  function cleanIndianAddressQuery(q) {
    if (!q) return '';
    return q.replace(/m-\d+\s*(and|&)?\s*\d*,?/gi, '')
            .replace(/plot\s*no\.?\s*\d+,?/gi, '')
            .replace(/near\s+[^,]+,/gi, '')
            .replace(/\s+/g, ' ')
            .trim();
  }

  function getClientApiKey() {
    try {
      if (typeof getActiveApiKey === 'function') {
        const k = getActiveApiKey();
        if (k) return k;
      }
      const custom = localStorage.getItem('GMAPS_ACTIVE_API_KEY');
      if (custom && custom.trim().startsWith('AIza') && custom.trim().length > 25) {
        return custom.trim();
      }
    } catch(e) {}
    return 'AIzaSyAH1WIeBlBSuGBavqKo7Xnqbf9EWRACDuE';
  }

  let activeAutocompleteAbort = null;
  let autocompleteDebounceTimer = null;

  function fetchLocationSuggestions(query) {
    if (!query || query.trim().length < 2) {
      hideLocationSuggestions();
      return;
    }

    const trimmedQ = query.trim();

    if (autocompleteDebounceTimer) {
      clearTimeout(autocompleteDebounceTimer);
    }

    autocompleteDebounceTimer = setTimeout(() => {
      executeRealPlacesAutocomplete(trimmedQ);
    }, 200);
  }

  function executeRealPlacesAutocomplete(query) {
    if (!query || query.trim().length < 2) {
      hideLocationSuggestions();
      return;
    }
    const cleanQ = query.trim();

    if (activeAutocompleteAbort) {
      activeAutocompleteAbort.abort();
    }
    activeAutocompleteAbort = new AbortController();
    const currentSignal = activeAutocompleteAbort.signal;

    // 1. If Google Maps JS API AutocompleteService is active, query it directly (Zero CORS)
    if (window.google && window.google.maps && window.google.maps.places && window.google.maps.places.AutocompleteService) {
      try {
        const autoService = new google.maps.places.AutocompleteService();
        autoService.getPlacePredictions({
          input: cleanQ,
          componentRestrictions: { country: 'in' }
        }, (predictions, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK && predictions && predictions.length > 0) {
            const matches = predictions.map((pred, idx) => {
              const main = (pred.structured_formatting && pred.structured_formatting.main_text) || pred.description.split(',')[0];
              const sec = (pred.structured_formatting && pred.structured_formatting.secondary_text) || '';
              return {
                index: idx,
                placeId: pred.place_id,
                name: main,
                formattedName: pred.description,
                detailedAddress: pred.description,
                hierarchyText: sec,
                types: pred.types || [],
                needsDetails: true
              };
            });
            renderLocationSuggestions(matches);
            return;
          }
          queryLiveGeospatialAutocomplete(cleanQ, currentSignal);
        });
        return;
      } catch (eAuto) {
        console.warn('Google AutocompleteService notice:', eAuto);
      }
    }

    // 2. Query Live Real-Time Geospatial Autocomplete (Photon / Nominatim)
    queryLiveGeospatialAutocomplete(cleanQ, currentSignal);
  }

  function queryLiveGeospatialAutocomplete(cleanQ, signal) {
    const cleanLower = cleanQ.toLowerCase();
    const allTokens = cleanLower.split(/\s+/).filter(Boolean);
    const stopWords = ['industrial', 'estate', 'pvt', 'ltd', 'limited', 'company', 'co', 'the', 'near', 'and', '&'];
    const significantTokens = allTokens.filter(t => !stopWords.includes(t));
    const activeTokens = significantTokens.length > 0 ? significantTokens : allTokens;

    const matchedLocal = LOCAL_SUGGESTION_CATALOG.filter(item => {
      const targetText = (item.name + ' ' + item.detailedAddress + ' ' + (item.keywords || []).join(' ')).toLowerCase();
      return activeTokens.every(token => targetText.includes(token));
    }).map((item, idx) => Object.assign({ index: idx }, item));

    const photonUrl = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(cleanQ) + '&limit=6';
    fetch(photonUrl, { signal: signal })
      .then(r => r.json())
      .then(data => {
        const features = (data && data.features) || [];
        if (features.length > 0) {
          const photonMatches = features.map((f, idx) => {
            const p = f.properties || {};
            const coords = f.geometry && f.geometry.coordinates; // [lng, lat]
            const lat = coords ? coords[1] : undefined;
            const lng = coords ? coords[0] : undefined;
            const name = p.name || cleanQ;
            const parts = [p.street, p.district, p.city, p.state, p.country].filter(Boolean);
            const detailed = parts.join(', ') || name;
            return {
              index: idx,
              placeId: 'OSM-' + (p.osm_id || idx),
              name: name,
              formattedName: name !== detailed ? (name + ' — ' + detailed) : name,
              detailedAddress: detailed,
              hierarchyText: [p.city, p.state, p.country].filter(Boolean).join(' › '),
              locality: p.city || p.district || '',
              city: p.city || '',
              state: p.state || '',
              country: p.country || 'India',
              latitude: lat,
              longitude: lng,
              types: [p.osm_value || 'commercial', 'establishment'],
              needsDetails: false
            };
          });

          if (matchedLocal.length > 0) {
            const combined = matchedLocal.concat(photonMatches.filter(m => !matchedLocal.some(l => l.name.toLowerCase() === m.name.toLowerCase())));
            renderLocationSuggestions(combined);
          } else {
            renderLocationSuggestions(photonMatches);
          }
        } else if (matchedLocal.length > 0) {
          renderLocationSuggestions(matchedLocal);
        } else {
          queryNominatimDirect(cleanQ, signal);
        }
      })
      .catch(err => {
        if (err.name === 'AbortError') return;
        if (matchedLocal.length > 0) {
          renderLocationSuggestions(matchedLocal);
        } else {
          queryNominatimDirect(cleanQ, signal);
        }
      });
  }

  function queryNominatimDirect(cleanQ, signal) {
    const coreQ = cleanQ.replace(/\b(limited|pvt|ltd|private|technologies|solutions)\b/gi, '').trim();
    const queryTerm = (coreQ.length >= 3 && coreQ.toLowerCase() !== cleanQ.toLowerCase()) ? coreQ : cleanQ;
    const nomUrl = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(queryTerm) + '&addressdetails=1&limit=6';

    fetch(nomUrl, { headers: { 'Accept': 'application/json' }, signal: signal })
      .then(r => r.json())
      .then(nomData => {
        if (Array.isArray(nomData) && nomData.length > 0) {
          const matches = nomData.map((item, idx) => {
            const pLat = parseFloat(item.lat);
            const pLng = parseFloat(item.lon);
            const addr = item.display_name || cleanQ;
            const name = item.name || cleanQ;
            return {
              index: idx,
              placeId: 'OSM-' + (item.osm_id || idx),
              name: name,
              formattedName: name !== addr ? (name + ' — ' + addr) : addr,
              detailedAddress: addr,
              latitude: pLat,
              longitude: pLng,
              types: [item.type || 'establishment'],
              needsDetails: false
            };
          });
          renderLocationSuggestions(matches);
        } else {
          fetchServerLocationSuggestions(cleanQ);
        }
      })
      .catch(err => {
        if (err.name === 'AbortError') return;
        fetchServerLocationSuggestions(cleanQ);
      });
  }

  let activeSuggestionSeq = 0;
  function fetchServerLocationSuggestions(query) {
    const currentSeq = ++activeSuggestionSeq;
    google.script.run
      .withSuccessHandler((res) => {
        if (currentSeq !== activeSuggestionSeq) return;
        if (res && res.found && res.matches && res.matches.length > 0) {
          renderLocationSuggestions(res.matches);
        } else {
          renderNoSuggestionsFound(query);
        }
      })
      .withFailureHandler(() => {
        renderNoSuggestionsFound(query);
      })
      .resolveLocationHierarchy(query);
  }

  function renderLocationSuggestions(matches) {
    const container = document.getElementById('location-suggestions');
    if (!container) return;

    if (!matches || matches.length === 0) {
      hideLocationSuggestions();
      return;
    }

    App.locationSuggestions = matches;
    let html = '';

    matches.forEach((m, idx) => {
      const hierarchy = m.hierarchyText || [m.locality, m.city, m.state, m.country].filter(Boolean).join(' › ');
      const detailed = m.detailedAddress || m.formattedName || '';
      const title = m.name || m.formattedName || 'Location';
      const hasCoords = m.latitude !== undefined && m.longitude !== undefined;
      const coordsText = hasCoords ? ` • 📌 ${Number(m.latitude).toFixed(4)}, ${Number(m.longitude).toFixed(4)}` : '';

      html += `
        <div class="suggestion-item" onclick="selectSuggestionByIndex(${idx})">
          <div class="sugg-text">
            <span class="sugg-name">📍 ${escapeHtml(title)}</span>
            <span class="sugg-address" style="font-size:12px; color:#475569; margin:2px 0; line-height:1.3;">
              ${escapeHtml(detailed)}
            </span>
            <span class="sugg-sub" style="font-size:11px; color:#64748b;">
              ${escapeHtml(hierarchy)}${coordsText}
            </span>
          </div>
          <span style="font-size:11px; font-weight:700; color:var(--brand-blue); background:#eff6ff; border:1px solid #bfdbfe; padding:4px 8px; border-radius:4px; white-space:nowrap; margin-left:8px;">
            Select ➔
          </span>
        </div>
      `;
    });

    container.innerHTML = html;
    container.style.display = 'flex';
  }

  function renderNoSuggestionsFound(query) {
    const container = document.getElementById('location-suggestions');
    if (!container) return;
    container.innerHTML = `
      <div style="padding:12px 16px; font-size:12px; color:#64748b; font-style:italic;">
        🔍 No verified Google Maps locations found matching "${escapeHtml(query)}". Please verify spelling or search by coordinates.
      </div>
    `;
    container.style.display = 'flex';
  }

  function hideLocationSuggestions() {
    const container = document.getElementById('location-suggestions');
    if (container) container.style.display = 'none';
  }

  function selectSuggestionByIndex(idx) {
    const loc = App.locationSuggestions[idx];
    if (!loc) return;

    const input = document.getElementById('location-search-input');
    if (input) input.value = loc.name || loc.formattedName || '';

    // If coordinates already exist, select immediately
    if (loc.latitude && loc.longitude) {
      selectConfirmedLocation(loc);
      return;
    }

    // Fetch live Place Details from Google Places API (New) to lock in exact coordinates
    const apiKey = getClientApiKey();
    if (loc.placeId && apiKey) {
      const detailsUrl = 'https://places.googleapis.com/v1/places/' + encodeURIComponent(loc.placeId) +
        '?fields=id,displayName,formattedAddress,location,types,nationalPhoneNumber,rating,userRatingCount,websiteUri,googleMapsUri';

      fetch(detailsUrl, {
        method: 'GET',
        headers: {
          'X-Goog-Api-Key': apiKey
        }
      })
      .then(r => r.json())
      .then(place => {
        if (place && place.location) {
          const confirmed = {
            id: place.id,
            placeId: place.id,
            name: (place.displayName && place.displayName.text) || loc.name,
            formattedName: (place.displayName && place.displayName.text ? place.displayName.text + ' — ' : '') + (place.formattedAddress || loc.formattedName),
            detailedAddress: place.formattedAddress || loc.detailedAddress,
            latitude: place.location.latitude,
            longitude: place.location.longitude,
            phone_number: place.nationalPhoneNumber || 'Not available',
            website: place.websiteUri || '',
            rating: typeof place.rating === 'number' ? place.rating : null,
            user_ratings_total: typeof place.userRatingCount === 'number' ? place.userRatingCount : 0,
            google_maps_url: place.googleMapsUri || ('https://maps.google.com/?q=place_id:' + place.id),
            primary_type: (place.types && place.types[0]) || 'Business',
            types: place.types || [],
            resolutionStatus: 'Verified by Google Places API (New)'
          };
          selectConfirmedLocation(confirmed);
          return;
        }
        callServerResolveLocation(loc.formattedName || loc.name);
      })
      .catch(() => {
        callServerResolveLocation(loc.formattedName || loc.name);
      });
      return;
    }

    callServerResolveLocation(loc.name || loc.formattedName);
  }

  function handleLocationInputSearch(callbackOnSuccess) {
    const input = document.getElementById('location-search-input');
    if (!input) return;

    const query = input.value.trim();
    if (!query) {
      showToast('Please enter a location, area, or company name.', 'warning');
      return;
    }

    // If this location was ALREADY confirmed, reuse immediately without redundant network calls
    if (App.confirmedLocation && (
        query === App.confirmedLocation.name ||
        query === App.confirmedLocation.formattedName ||
        query.toLowerCase().includes((App.confirmedLocation.name || '').toLowerCase()) ||
        (App.confirmedLocation.formattedName || '').toLowerCase().includes(query.toLowerCase())
    )) {
      selectConfirmedLocation(App.confirmedLocation);
      if (typeof callbackOnSuccess === 'function') {
        callbackOnSuccess(App.confirmedLocation);
      }
      return;
    }

    const btn = document.getElementById('btn-search-location');
    callServerResolveLocation(query, btn, callbackOnSuccess);
  }


  function callServerResolveLocation(query, btn, callbackOnSuccess) {
    const resolveBtn = btn || document.getElementById('btn-search-location');
    if (resolveBtn) {
      resolveBtn.disabled = true;
      resolveBtn.textContent = 'Resolving...';
    }

    let isDone = false;
    const safetyTimer = setTimeout(() => {
      if (!isDone) {
        isDone = true;
        if (resolveBtn) {
          resolveBtn.disabled = false;
          resolveBtn.textContent = 'Resolve Location';
        }
        showToast('Location lookup timed out. You can re-try or use the "Search by Coordinates" tab.', 'warning');
      }
    }, 35000);

    google.script.run
      .withSuccessHandler((res) => {
        const wasLate = isDone;
        isDone = true;
        clearTimeout(safetyTimer);
        if (resolveBtn) {
          resolveBtn.disabled = false;
          resolveBtn.textContent = 'Resolve Location';
        }

        try {
          if (!res || !res.found) {
            showToast((res && res.message) || 'No matching location found. Please refine query.', 'error');
            return;
          }

          const topLoc = (res.matches && res.matches[0]) || res.resolvedLocation || res.match;
          if (res.isAmbiguous && res.matches && res.matches.length > 1) {
            renderLocationSuggestions(res.matches);
            if (topLoc) {
              selectConfirmedLocation(topLoc);
              if (typeof callbackOnSuccess === 'function') {
                callbackOnSuccess(topLoc);
              }
            }
          } else if (topLoc) {
            selectConfirmedLocation(topLoc);
            if (typeof callbackOnSuccess === 'function') {
              callbackOnSuccess(topLoc);
            }
          } else {
            showToast('Unable to parse location response.', 'error');
          }
        } catch (e) {
          console.error(e);
        }
      })
      .withFailureHandler((err) => {
        if (isDone) return;
        isDone = true;
        clearTimeout(safetyTimer);
        if (resolveBtn) {
          resolveBtn.disabled = false;
          resolveBtn.textContent = 'Resolve Location';
        }

        try {
          const msg = (err && err.message) || '';
          if (/quota|limit|exceeded|resource_exhausted|429/i.test(msg)) {
            App.quotaExhausted = true;
            updateHeaderStatus({ status: 'quota' });
            showToast('⚠️ Google Places Daily Quota Limit reached (100/day on unbilled project).', 'warning');
          } else {
            showToast('Geocoding notice: ' + msg, 'warning');
          }
        } catch (e) {
          console.error(e);
        }
      })
      .resolveLocationHierarchy(query);
  }

      if (btnName) btnName.classList.add('active');
      if (btnCoords) btnCoords.classList.remove('active');
      if (contName) contName.style.display = 'block';
      if (contCoords) contCoords.style.display = 'none';
    }
  }

  function handleCoordinatePaste(val) {
    if (!val || !val.includes(',')) return;
    const parts = val.split(',');
    if (parts.length >= 2) {
      const lat = parseFloat(parts[0].trim());
      const lng = parseFloat(parts[1].trim());
      if (!isNaN(lat) && !isNaN(lng)) {
        const latInput = document.getElementById('coord-lat-input');
        const lngInput = document.getElementById('coord-lng-input');
        if (latInput) latInput.value = lat;
        if (lngInput) lngInput.value = lng;
        hideCoordError();
      }
    }
  }

  function hideCoordError() {
    const errEl = document.getElementById('coord-error-msg');
    if (errEl) {
      errEl.style.display = 'none';
      errEl.textContent = '';
    }
  }

  function showCoordError(msg) {
    const errEl = document.getElementById('coord-error-msg');
    if (errEl) {
      errEl.style.display = 'block';
      errEl.textContent = msg;
    }
  }

  function clearCoordinateInputs() {
    const pasteInput = document.getElementById('coord-paste-input');
    const latInput = document.getElementById('coord-lat-input');
    const lngInput = document.getElementById('coord-lng-input');
    if (pasteInput) pasteInput.value = '';
    if (latInput) latInput.value = '';
    if (lngInput) lngInput.value = '';
    hideCoordError();
  }

  function executeCoordinateSearch() {
    hideCoordError();
    const latInput = document.getElementById('coord-lat-input');
    const lngInput = document.getElementById('coord-lng-input');
    
    const latVal = latInput ? latInput.value.trim() : '';
    const lngVal = lngInput ? lngInput.value.trim() : '';

    if (!latVal || !lngVal) {
      showCoordError('Please enter both Latitude and Longitude values.');
      return;
    }

    const lat = parseFloat(latVal);
    const lng = parseFloat(lngVal);

    if (isNaN(lat) || lat < -90 || lat > 90) {
      showCoordError('Invalid Latitude: Value must be a valid number between -90.0 and +90.0.');
      return;
    }

    if (isNaN(lng) || lng < -180 || lng > 180) {
      showCoordError('Invalid Longitude: Value must be a valid number between -180.0 and +180.0.');
      return;
    }

    const coordLoc = {
      name: `Coordinates (${lat.toFixed(4)}, ${lng.toFixed(4)})`,
      formattedName: `Coordinates (${lat.toFixed(4)}, ${lng.toFixed(4)})`,
      latitude: lat,
      longitude: lng,
      placeId: `COORD-${lat.toFixed(4)}-${lng.toFixed(4)}`,
      resolutionStatus: 'Direct Geographic Coordinates Input'
    };

    selectConfirmedLocation(coordLoc);
    showToast(`Search centre set to (${lat.toFixed(4)}, ${lng.toFixed(4)}). Discovering nearby companies...`, 'info');
    execute1KmIndustrialSearch();
  }

  // ----------------------------------------------------------------------------
  // 100% FREE INTERACTIVE MAP INTEGRATION (LEAFLET + OPENSTREETMAP)
  // Zero Cost, No Billing Required, No Error Modals, Full Pan/Zoom/Click/Pins
  // ----------------------------------------------------------------------------
  function initMap() {
    if (typeof L !== 'undefined') {
      setupMap();
      return;
    }
    const defaultLat = (App.confirmedLocation && App.confirmedLocation.latitude) || 18.6272;
    const defaultLng = (App.confirmedLocation && App.confirmedLocation.longitude) || 73.8465;
    renderVectorMapSvg(defaultLat, defaultLng, 'Search Perimeter Active');

    let attempts = 0;
    const checkL = setInterval(() => {
      attempts++;
      if (typeof L !== 'undefined') {
        clearInterval(checkL);
        setupMap();
      } else if (attempts >= 30) {
        clearInterval(checkL);
        initGoogleMapsMode();
      }
    }, 100);
  }

  App.currentTileLayer = null;
  App.activeLayerType = 'STREET';

  function switchMapLayer(type) {
    App.activeLayerType = type;
    document.querySelectorAll('.map-layer-selector .layer-btn').forEach(btn => btn.classList.remove('active-layer'));
    const btn = document.getElementById('btn-layer-' + type.toLowerCase());
    if (btn) btn.classList.add('active-layer');

    if (type === 'GOOGLE') {
      showToast('Activating Google Maps JavaScript SDK...', 'info');
      initGoogleMapsMode();
      return;
    }

    // Leaflet Layers (100% Free, Zero 403 Blocks, Zero Watermarks)
    if (!App.map) {
      setupMap();
      return;
    }
    if (App.currentTileLayer) {
      App.map.removeLayer(App.currentTileLayer);
    }

    let url = '';
    let attr = '';
    if (type === 'SATELLITE') {
      url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
      attr = 'Tiles &copy; Esri World Imagery';
    } else if (type === 'TOPO') {
      url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}';
      attr = 'Tiles &copy; Esri Topo';
    } else {
      // STREET (Default)
      url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
      attr = 'Tiles &copy; Esri World Street Map & OpenStreetMap';
    }

    App.currentTileLayer = L.tileLayer(url, { maxZoom: 19, attribution: attr }).addTo(App.map);
    showToast(`Switched map layer to ${type}`, 'info');
  }

  function initGoogleMapsMode() {
    const mapContainer = document.getElementById('location-map-container');
    if (!mapContainer) return;

    const defaultLat = (App.confirmedLocation && App.confirmedLocation.latitude) || 18.6272;
    const defaultLng = (App.confirmedLocation && App.confirmedLocation.longitude) || 73.8465;

    function renderGMap() {
      try {
        if (App.map && App.map.remove) {
          App.map.remove();
          App.map = null;
        }
        mapContainer.innerHTML = '';
        const gCenter = new window.google.maps.LatLng(defaultLat, defaultLng);
        const gMap = new window.google.maps.Map(mapContainer, {
          center: gCenter,
          zoom: 14,
          mapTypeId: window.google.maps.MapTypeId.ROADMAP
        });

        const gMarker = new window.google.maps.Marker({
          position: gCenter,
          map: gMap,
          draggable: true,
          title: 'Search Centre'
        });

        const gCircle = new window.google.maps.Circle({
          center: gCenter,
          radius: 1000,
          map: gMap,
          fillColor: '#3b82f6',
          fillOpacity: 0.2,
          strokeColor: '#1d4ed8',
          strokeWeight: 2
        });

        gMap.addListener('click', (e) => {
          handleMapCoordinateClick(e.latLng.lat(), e.latLng.lng());
          gMarker.setPosition(e.latLng);
          gCircle.setCenter(e.latLng);
        });

        gMarker.addListener('dragend', (e) => {
          handleMapCoordinateClick(e.latLng.lat(), e.latLng.lng());
          gCircle.setCenter(e.latLng);
        });

        App.googleMapInstance = gMap;
        showToast('Google Maps successfully loaded with your API key.', 'success');
      } catch (err) {
        showToast('Google Maps: ' + err.message + '. Using Free Street Map.', 'warning');
        switchMapLayer('STREET');
      }
    }

    if (window.google && window.google.maps && window.google.maps.Map) {
      renderGMap();
    } else {
      const activeMapKey = localStorage.getItem('GMAPS_ACTIVE_API_KEY') || '';
      const gScript = document.createElement('script');
      gScript.src = 'https://maps.googleapis.com/maps/api/js?key=' + activeMapKey + '&libraries=places,geometry';
      gScript.async = true;
      gScript.onload = () => { renderGMap(); };
      gScript.onerror = () => {
        showToast('Google Maps script failed to load. Reverting to Free Street Map.', 'warning');
        switchMapLayer('STREET');
      };
      document.head.appendChild(gScript);
    }
  }

  function setupMap() {
    const mapContainer = document.getElementById('location-map-container');
    if (!mapContainer) return;

    const defaultLat = (App.confirmedLocation && App.confirmedLocation.latitude) || 18.6272;
    const defaultLng = (App.confirmedLocation && App.confirmedLocation.longitude) || 73.8465;

    if (typeof L === 'undefined') {
      return;
    }

    if (App.map) {
      try {
        App.map.setView([defaultLat, defaultLng], App.confirmedLocation ? 14 : 11);
        if (App.mapMarker && App.mapMarker.setLatLng) App.mapMarker.setLatLng([defaultLat, defaultLng]);
        if (App.mapCircle && App.mapCircle.setLatLng) App.mapCircle.setLatLng([defaultLat, defaultLng]);
        setTimeout(() => { if (App.map) App.map.invalidateSize(); }, 150);
        return;
      } catch (e) {
        console.warn('Error updating existing map view:', e);
      }
    }

    try {
      mapContainer.innerHTML = '';
      if (mapContainer._leaflet_id) {
        mapContainer._leaflet_id = null;
      }

      App.map = L.map(mapContainer, {
        center: [defaultLat, defaultLng],
        zoom: App.confirmedLocation ? 14 : 11,
        zoomControl: true
      });

      // Esri World Street Map: 100% Free, Crisp, Zero 403 Blocks, Zero Watermarks
      App.currentTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, USGS, OpenStreetMap'
      }).addTo(App.map);

      // Custom pulsing search centre pin
      const centerIcon = L.divIcon({
        className: 'custom-center-pin',
        html: '<div style="background:#2563eb; width:28px; height:28px; border-radius:50%; border:3px solid #ffffff; box-shadow:0 0 10px rgba(37,99,235,0.8); display:flex; align-items:center; justify-content:center; color:#ffffff; font-size:14px; font-weight:800; cursor:grab;">📍</div>',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      App.mapMarker = L.marker([defaultLat, defaultLng], {
        icon: centerIcon,
        draggable: true,
        title: 'Search Centre (Click anywhere on map or drag pin to move)'
      }).addTo(App.map);

      // Strict 1,000 metre perimeter boundary circle (Haversine search radius)
      App.mapCircle = L.circle([defaultLat, defaultLng], {
        radius: 1000,
        color: '#1d4ed8',
        fillColor: '#3b82f6',
        fillOpacity: 0.15,
        weight: 2
      }).addTo(App.map);

      // Interactive Map Click: Click anywhere on map to set search centre
      App.map.on('click', function(e) {
        handleMapCoordinateClick(e.latlng.lat, e.latlng.lng);
      });

      // Interactive Pin Drag: Drag pin to set search centre
      App.mapMarker.on('dragend', function(e) {
        const pos = e.target.getLatLng();
        handleMapCoordinateClick(pos.lat, pos.lng);
      });

      // Force layout invalidation so tiles draw immediately
      setTimeout(() => {
        if (App.map) App.map.invalidateSize();
      }, 200);

      // Render company markers if already loaded
      if (App.filteredCompanies && App.filteredCompanies.length > 0) {
        renderMapCompanyMarkers(App.filteredCompanies);
      }

      const jsKeyDiag = document.getElementById('diag-js-key-status');
      if (jsKeyDiag) jsKeyDiag.textContent = 'Esri World Street Map Active (100% Free, Zero Billing)';
      return;
    } catch (e) {
      console.warn('Leaflet initialization error:', e);
      renderVectorMapSvg(defaultLat, defaultLng, 'Open Interactive Map Active');
    }
  }

  function handleMapCoordinateClick(lat, lng) {
    if (App.isSearching) return;

    showToast(`Picked coordinates: ${lat.toFixed(4)}, ${lng.toFixed(4)}. Resolving location...`, 'info');

    if (App.mapMarker && App.mapMarker.setLatLng) App.mapMarker.setLatLng([lat, lng]);
    if (App.mapCircle && App.mapCircle.setLatLng) App.mapCircle.setLatLng([lat, lng]);

    const mapCentreText = document.getElementById('map-centre-text');
    if (mapCentreText) mapCentreText.textContent = `Resolving coordinates (${lat.toFixed(4)}, ${lng.toFixed(4)})...`;

    // Reverse geocode via Photon (100% Free, zero cost)
    fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lng}`)
      .then(r => r.json())
      .then(data => {
        if (data && data.features && data.features.length > 0) {
          const p = data.features[0].properties || {};
          const city = p.city || p.district || p.county || '';
          const state = p.state || '';
          const country = p.country || 'India';
          const name = p.name || city || 'Search Point';
          const formatted = [name, city, state, country].filter(Boolean).join(', ');

          const loc = {
            formattedName: formatted,
            country: country,
            state: state,
            city: city || state || 'Selected Region',
            locality: name,
            postalCode: p.postcode || '',
            latitude: lat,
            longitude: lng,
            placeId: 'OSM_REV_' + (p.osm_id || Date.now()),
            resolutionStatus: 'Resolved via Map Click & Open Reverse Geocoding'
          };
          selectConfirmedLocation(loc);
          if (App.mapMarker) {
            App.mapMarker.bindPopup(`<b>Search Centre Set:</b><br>${escapeHtml(formatted)}<br><small>${lat.toFixed(4)}, ${lng.toFixed(4)}</small>`).openPopup();
          }
          return;
        }

        const loc = {
          formattedName: `Selected Coordinates (${lat.toFixed(4)}, ${lng.toFixed(4)})`,
          country: 'India',
          state: 'Selected Region',
          city: 'Selected Area',
          locality: 'Search Point',
          latitude: lat,
          longitude: lng,
          placeId: `COORD_${lat.toFixed(4)}_${lng.toFixed(4)}`,
          resolutionStatus: 'Custom Coordinates via Map Click'
        };
        selectConfirmedLocation(loc);
        if (App.mapMarker) {
          App.mapMarker.bindPopup(`<b>Search Centre:</b><br>${loc.formattedName}`).openPopup();
        }
      })
      .catch(() => {
        const loc = {
          formattedName: `Selected Coordinates (${lat.toFixed(4)}, ${lng.toFixed(4)})`,
          country: 'India',
          state: 'Selected Region',
          city: 'Selected Area',
          locality: 'Search Point',
          latitude: lat,
          longitude: lng,
          placeId: `COORD_${lat.toFixed(4)}_${lng.toFixed(4)}`,
          resolutionStatus: 'Custom Coordinates via Map Click'
        };
        selectConfirmedLocation(loc);
        if (App.mapMarker) {
          App.mapMarker.bindPopup(`<b>Search Centre:</b><br>${loc.formattedName}`).openPopup();
        }
      });
  }

  function updateMapLocation(lat, lng, name) {
    if (App.map && App.map.setView) {
      App.map.setView([lat, lng], 14);
      if (App.mapMarker && App.mapMarker.setLatLng) {
        App.mapMarker.setLatLng([lat, lng]);

      if (App.mapCircle && App.mapCircle.setLatLng) {
        App.mapCircle.setLatLng([lat, lng]);
        App.mapCircle.setRadius(1000); // Strict 1,000 m
      }
      return;
    }

    renderVectorMapSvg(lat, lng, name);
  }

  function execute1KmIndustrialSearch() {
    if (App.isSearching) return;

    const locInput = document.getElementById('location-search-input');
    const inputQuery = locInput ? locInput.value.trim() : '';

    // If no confirmed location yet, but user entered text in input: auto-resolve FIRST!
    if (!App.confirmedLocation && inputQuery) {
      handleLocationInputSearch((resolvedLoc) => {
        runSearchWithConfirmedLocation(resolvedLoc);
      });
      return;
    }

    if (!App.confirmedLocation) {
      showToast('Please enter a company or location above first.', 'warning');
      if (locInput) locInput.focus();
      return;
    }

    runSearchWithConfirmedLocation(App.confirmedLocation);
  }

  function runSearchWithConfirmedLocation(loc) {
    const searchBtn = document.getElementById('btn-run-1km-search');
    const progressBox = document.getElementById('search-progress-box');
    const errorBox = document.getElementById('search-error-box');

    App.isSearching = true;
    const locKey = loc.placeId || (loc.latitude ? (loc.latitude.toFixed(3) + ',' + loc.longitude.toFixed(3)) : 'def');
    if (App.currentLocationKey !== locKey) {
      App.currentLocationKey = locKey;
      App.allDiscoveredCache = {};
      App.rawDiscoveredCompanies = [];
    }
    App.companies = [];
    if (searchBtn) searchBtn.disabled = true;
    if (progressBox) progressBox.style.display = 'flex';
    if (errorBox) errorBox.style.display = 'none';

    const targetRadius = App.searchRadius || 3000;
    const searchParams = {
      searchType: 'radius',
      sessionName: `${loc.formattedName} ${(targetRadius / 1000)}km MSME Search - ${new Date().toLocaleTimeString()}`,
      locationHierarchy: loc,
      center: { lat: loc.latitude, lng: loc.longitude },
      radius: targetRadius,
      keywords: App.keywords.map(k => k.keyword),
      maxPages: 1
    };

    showToast(`Searching industrial companies & MSMEs within ${(targetRadius / 1000)} km of ${loc.locality || loc.formattedName}...`, 'info');

    const searchSafetyTimer = setTimeout(() => {
      if (App.isSearching) {
        App.isSearching = false;
        if (searchBtn) searchBtn.disabled = false;
        if (progressBox) progressBox.style.display = 'none';
        showToast('Search timed out. Please try again or check your API key.', 'warning');
      }
    }, 45000);

    google.script.run
      .withSuccessHandler((response) => {
        clearTimeout(searchSafetyTimer);
        App.isSearching = false;
        if (searchBtn) searchBtn.disabled = false;
        if (progressBox) progressBox.style.display = 'none';

        if (!response || !response.success) {
          const errMsg = (response && response.error) || 'Failed to complete search';
          showSearchError('Places Search Failed', errMsg);
          return;
        }

        const raw = response.totalRawFound || 0;
        const added = response.newCompaniesAdded || 0;
        const dups = response.duplicatesPrevented || 0;
        const returnedCompanies = response.companies || [];

        App.currentSearchId = response.sessionId || '';
        const sessDiag = document.getElementById('diag-session-id');
        if (sessDiag) sessDiag.textContent = App.currentSearchId;

        // Guarantee searched anchor company is ALWAYS included in the results list at distance 0 m
        const anchorName = loc.name;
        const anchorPid = loc.placeId;
        const isCoordSearch = anchorPid && anchorPid.startsWith('COORD-');
        const genericAreaNames = ['pune', 'maharashtra', 'india', 'bhosari', 'midc', 'chakan', 'hadapsar', 'pcmc'];
        const isGenericArea = anchorName && genericAreaNames.includes(anchorName.toLowerCase().trim());

        if (anchorName && !isCoordSearch && !isGenericArea) {
          const alreadyExists = returnedCompanies.some(c => 
            (c.place_id && anchorPid && c.place_id === anchorPid) ||
            (c.company_name && c.company_name.toLowerCase().trim() === anchorName.toLowerCase().trim())
          );

          if (!alreadyExists) {
            const rating = (typeof loc.rating === 'number' && loc.rating > 0) ? loc.rating : null;
            const reviews = typeof loc.user_ratings_total === 'number' ? loc.user_ratings_total : (loc.review_count || 0);
            let tier = 'Bronze';
            if (rating !== null && rating >= 4.5 && reviews >= 100) tier = 'Gold';
            else if (rating !== null && rating >= 4.0 && reviews >= 25) tier = 'Silver';

            const anchorComp = {
              record_id: 'ANCHOR-' + (anchorPid || Date.now()),
              place_id: anchorPid || ('ANCHOR-' + Date.now()),
              company_name: anchorName,
              category: tier,
              industrial_sector: loc.industrial_sector || loc.primary_type || 'Industrial Enterprise (Search Target)',
              primary_type: 'industrial',
              formatted_address: loc.detailedAddress || loc.formatted_address || loc.formattedName || 'Address verified',
              rating: rating,
              review_count: reviews,
              latitude: loc.latitude,
              longitude: loc.longitude,
              distance_meters: 0,
              distance_text: '0 m (Search Target)',
              phone_number: loc.phone_number || 'Not available',
              international_phone_number: loc.international_phone_number || loc.phone_number || 'Not available',
              website: loc.website || 'Not available',
              google_maps_url: loc.google_maps_url || (anchorPid ? `https://maps.google.com/?q=place_id:${anchorPid}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(anchorName)}`),
              verification_status: 'Verified by Google Places',
              relevance_score: 'High Industrial Relevance',
              record_source: 'Google Places API (New)',
              is_search_center: true,
              matched_keywords: ['Search Target', 'Anchor Company']
            };
            returnedCompanies.unshift(anchorComp);
          }
        }

        // Store and merge all discovered places cumulatively for real-time radius switching!
        if (!App.allDiscoveredCache) App.allDiscoveredCache = {};
        returnedCompanies.forEach(c => {
          const key = c.place_id || c.record_id || c.company_name;
          App.allDiscoveredCache[key] = c;
        });
        App.rawDiscoveredCompanies = Object.values(App.allDiscoveredCache);

        // Calculate distances client-side and industrial keyword scores
        const cLat = loc.latitude;
        const cLng = loc.longitude;
        App.rawDiscoveredCompanies.forEach(c => {
          if (c.is_search_center) {
            c.distance_meters = 0;
            c.distance_text = '0 m (Search Target)';
          } else if (c.latitude && c.longitude) {
            const distM = calculateHaversineDistance(cLat, cLng, c.latitude, c.longitude);
            c.distance_meters = distM;
            c.distance_text = formatDistanceText(distM);
          }
          const kwData = calculateIndustrialKeywordScore(c.company_name, c.industrial_sector);
          c.keyword_score = kwData.score;
          c.matched_keywords = kwData.matchedKeywords;
        });

        // Filter strictly by Haversine distance <= targetRadius AND industrial (always preserve search target)
        let strictlyIndustrial = App.rawDiscoveredCompanies.filter(c => {
          return (c.is_search_center || (c.distance_meters === undefined || c.distance_meters <= targetRadius)) &&
                 (c.is_search_center || isStrictlyIndustrial(c.company_name, c.industrial_sector, c.primary_type));
        });

        // Safety guarantee: If all returned places are genuine commercial/MSME entities from Google/OSM within radius,
        // do not let overly tight filters discard them to zero
        if (strictlyIndustrial.length === 0 && App.rawDiscoveredCompanies.length > 0) {
          strictlyIndustrial = App.rawDiscoveredCompanies.filter(c => {
            return c.is_search_center || (c.distance_meters === undefined || c.distance_meters <= targetRadius);
          });
        }

        // Sort by distance ASC so the searched company is Row #1
        strictlyIndustrial.sort((a, b) => (a.distance_meters || 0) - (b.distance_meters || 0));
        App.companies = strictlyIndustrial;

        // Apply filters & render table
        applyTableFilters();

        const countBadge = document.getElementById('results-count-badge');
        if (countBadge) countBadge.textContent = `${strictlyIndustrial.length} Companies (${(targetRadius / 1000)} km)`;

        showToast(`Search complete: ${raw} places scanned. ${strictlyIndustrial.length} verified within ${(targetRadius / 1000)} km.`, 'success');

        // Scroll to results table
        const secRes = document.getElementById('section-results');
        if (secRes) secRes.scrollIntoView({ behavior: 'smooth' });
      })
      .withFailureHandler((err) => {
        clearTimeout(searchSafetyTimer);
        App.isSearching = false;
        if (searchBtn) searchBtn.disabled = false;
        if (progressBox) progressBox.style.display = 'none';

        const msg = (err && err.message) || '';
        if (/quota|limit|exceeded|resource_exhausted|429/i.test(msg)) {
          showSearchError('Google API Daily Quota Exceeded (100/day)', 'Your Google Cloud Project has reached its 100 free daily limit. Please click "🔑 API Key & Quota" in the top bar to switch project key or unlock 10,000+ free searches with billing.');
          setTimeout(() => { openApiKeyModal(); }, 600);
        } else {
          showSearchError('Places API Error', msg);
        }
      })
      .runIndustrialSearch(searchParams);
  }

  function isStrictlyIndustrial(name, sector, primaryType) {
    if (!name || typeof name !== 'string') return false;
    const lowerName = name.toLowerCase();
    const lowerSector = (sector || '').toLowerCase();
    const lowerType = (primaryType || '').toLowerCase();

    // 1. Check blacklist - immediately reject non-industrial places (hospitals, schools, hotels, restaurants, etc.)
    for (let i = 0; i < STRICT_NON_INDUSTRIAL_BLACKLIST.length; i++) {
      const bl = STRICT_NON_INDUSTRIAL_BLACKLIST[i];
      if (lowerName.includes(bl)) {
        return false;
      }
    }

    // 2. Check sector & type: If classified by Google Places / OSM as an industrial, manufacturing, wholesale, or corporate entity
    if (lowerType.includes('manufacturer') || lowerType.includes('industrial') || lowerType.includes('wholesaler') ||
        lowerType.includes('corporate_office') || lowerType.includes('factory') ||
        lowerSector.includes('industrial') || lowerSector.includes('manufacturing') || lowerSector.includes('manufacturer') ||
        lowerSector.includes('factory') || lowerSector.includes('engineering') || lowerSector.includes('wholesaler') ||
        lowerSector.includes('corporate') || lowerSector.includes('supplier') || lowerSector.includes('craft') ||
        lowerSector.includes('man_made') || lowerSector.includes('electrical') || lowerSector.includes('earthing') ||
        lowerSector.includes('fabricat') || lowerSector.includes('technology') || lowerSector.includes('automotive') ||
        lowerSector.includes('systems') || lowerSector.includes('equipment') || lowerSector.includes('machin') ||
        lowerSector.includes('distributor') || lowerSector.includes('dealer')) {
      return true;
    }

    // 3. Positive industrial keywords using comprehensive word stems (singular & plural, abbreviations, MSME trades)
    const INDUSTRIAL_STEMS = [
      'industr', 'mfg', 'manufactur', 'engineer', 'fabricat', 'machin', 'tool', 'cnc', 'lathe',
      'foundry', 'cast', 'forg', 'mould', 'mold', 'die', 'dies', 'automat', 'robot', 'hydraul',
      'pneumat', 'laser', 'weld', 'msme', 'earthing', 'grounding', 'lightning', 'solut', 'suppl',
      'instrument', 'equip', 'boiler', 'fasten', 'hardwar', 'pipe', 'tube', 'fit', 'flange',
      'steel', 'metal', 'alloy', 'iron', 'polymer', 'plastic', 'rubber', 'chemic', 'packag',
      'corrugat', 'electron', 'electr', 'transform', 'switchgear', 'panel', 'cable', 'wire',
      'power', 'energy', 'solar', 'valve', 'pump', 'motor', 'gear', 'bearing', 'precis',
      'auto', 'ancillar', 'techno', 'plm', 'system', 'plant', 'work', 'enterpris', 'workshop',
      'laborat', 'corp', 'agency', 'distributor', 'trader', 'co-op', 'commercial', 'radiator'
    ];
    for (let i = 0; i < INDUSTRIAL_STEMS.length; i++) {
      if (lowerName.includes(INDUSTRIAL_STEMS[i])) {
        return true;
      }
    }

    // 4. Default to true if the entity comes from an industrial search without blacklist violation
    return lowerType.length > 0 && !lowerType.includes('establishment');
  }

  function calculateIndustrialKeywordScore(name, sector) {
    if (!name) return { score: 0, matchedKeywords: [] };
    const lower = name.toLowerCase();
    let score = 0;
    const matched = [];

    for (const kw in INDUSTRIAL_KEYWORDS_SCORES) {
      if (lower.includes(kw)) {
        score += INDUSTRIAL_KEYWORDS_SCORES[kw];
        if (kw !== 'pvt ltd' && kw !== 'ltd' && kw !== 'llp') {
          matched.push(kw.charAt(0).toUpperCase() + kw.slice(1));
        }
      }
    }

    // Deduplicate matched keywords
    const uniqueMatched = Array.from(new Set(matched));
    return { score, matchedKeywords: uniqueMatched };
  }

  function applyTableFilters() {
    let list = App.companies.slice();

    // 0. Strict Industrial Filter enforcement
    list = list.filter(c => isStrictlyIndustrial(c.company_name, c.industrial_sector, c.primary_type));

    // 1. Text Search Filter
    if (App.searchQuery) {
      const q = App.searchQuery;
      list = list.filter(c => {
        return (c.company_name && c.company_name.toLowerCase().includes(q)) ||
               (c.formatted_address && c.formatted_address.toLowerCase().includes(q)) ||
               (c.industrial_sector && c.industrial_sector.toLowerCase().includes(q)) ||
               (c.phone_number && c.phone_number.toLowerCase().includes(q)) ||
               (c.website && c.website.toLowerCase().includes(q));
      });
    }

    // 2. Relevance Filter
    const relSelect = document.getElementById('filter-relevance');
    if (relSelect) {
      App.relevanceFilter = relSelect.value;
      if (App.relevanceFilter === 'HIGH') {
        list = list.filter(c => c.relevance_score === 'HIGH' || c.relevance_score === 'High Industrial Relevance');
      } else if (App.relevanceFilter === 'MEDIUM') {
        list = list.filter(c => c.relevance_score === 'HIGH' || c.relevance_score === 'MEDIUM' || c.relevance_score === 'High Industrial Relevance' || c.relevance_score === 'Medium Industrial Relevance');
      } else if (App.relevanceFilter === 'REVIEW') {
        list = list.filter(c => (c.verification_status !== 'Verified' && c.verification_status !== 'Verified by Team') || c.relevance_score === 'Needs Review');
      }
    }

    // 3. Tier Filter
    if (App.tierFilter && App.tierFilter !== 'ALL') {
      list = list.filter(c => {
        const effTier = c.manager_category_override || c.category;
        return effTier === App.tierFilter;
      });
    }

    // 3.5 CRM Lead Status Filter
    const statusSelect = document.getElementById('filter-lead-status');
    if (statusSelect && statusSelect.value !== 'ALL') {
      const selectedStatus = statusSelect.value;
      list = list.filter(c => {
        const effStatus = c.follow_up_status || 'New';
        return effStatus === selectedStatus;
      });
    }

    // 4. SORT BY INDUSTRIAL KEYWORDS IN NAME (DEFAULT)
    const sortSelect = document.getElementById('table-sort-order');
    const sortOrder = sortSelect ? sortSelect.value : 'KEYWORD_RELEVANCE';

    if (sortOrder === 'KEYWORD_RELEVANCE') {
      // Sort primarily by matched industrial keywords score, secondarily by distance
      list.sort((a, b) => {
        const scoreDiff = (b.keyword_score || 0) - (a.keyword_score || 0);
        if (scoreDiff !== 0) return scoreDiff;
        return (a.distance_meters || 0) - (b.distance_meters || 0);
      });
    } else if (sortOrder === 'DISTANCE_ASC') {
      list.sort((a, b) => (a.distance_meters || 0) - (b.distance_meters || 0));
    } else if (sortOrder === 'NAME_ASC') {
      list.sort((a, b) => (a.company_name || '').localeCompare(b.company_name || ''));
    } else if (sortOrder === 'RATING_DESC') {
      list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
    }

    App.filteredCompanies = list;
    App.pagination.total = list.length;
    App.pagination.totalPages = Math.ceil(list.length / App.pagination.pageSize) || 1;
    if (App.pagination.page > App.pagination.totalPages) {
      App.pagination.page = App.pagination.totalPages;
    }

    const badge = document.getElementById('results-count-badge');
    if (badge) {
      badge.textContent = `${list.length} ${list.length === 1 ? 'Industrial Company' : 'Industrial Companies'}`;
    }

    renderTablePage();
    renderMapCompanyMarkers(App.filteredCompanies);
    updateDashboardKPIs();
  }

  function updatePaginationControls() {
    const summary = document.getElementById('pagination-summary');
    const pageNum = document.getElementById('pagination-page-num');
    const prevBtn = document.getElementById('btn-prev-page');
    const nextBtn = document.getElementById('btn-next-page');

    const total = App.pagination.total;
    const start = total === 0 ? 0 : (App.pagination.page - 1) * App.pagination.pageSize + 1;
    const end = Math.min(App.pagination.page * App.pagination.pageSize, total);

    if (summary) summary.textContent = `Showing ${start} to ${end} of ${total} companies`;
    if (pageNum) pageNum.textContent = `Page ${App.pagination.page} of ${App.pagination.totalPages}`;
    if (prevBtn) prevBtn.disabled = App.pagination.page <= 1;
    if (nextBtn) nextBtn.disabled = App.pagination.page >= App.pagination.totalPages;
  }

    if (newPage >= 1 && newPage <= App.pagination.totalPages) {
      App.pagination.page = newPage;
      renderTablePage();
    }
  }

  // Clean company name for corporate search (LinkedIn, ZaubaCorp, MCA, Instagram)
  // Strips SEO subtitle stuffing, comma descriptions, address suffixes, survey numbers, MIDC tags, and legal designations
  function cleanCompanyNameForSearch(name) {
    if (!name) return '';

    // 1. Split at first delimiter: hyphen, en-dash, em-dash, pipe, colon, or comma
    // e.g. "Funkiezz52 Custom Tshirts Pune, Custom Jerseys..." -> "Funkiezz52 Custom Tshirts Pune"
    // e.g. "Yash Earthing Solutions PVT LTD - Survey No. - 19..." -> "Yash Earthing Solutions PVT LTD"
    let clean = name.split(/\s*[-–—|:]\s*/)[0];
    clean = clean.split(',')[0];

    // 2. Strip common Indian city/suburb names that are appended to business names
    clean = clean.replace(/\b(pune|pcmc|mumbai|bhosari|chakan|hadapsar|delhi|bangalore|bengaluru|hyderabad|chennai|ahmedabad|kolkata|nashik|aurangabad)\b/gi, ' ');

    // 3. Strip legal corporate suffixes
    clean = clean.replace(/\b(private\s+limited|pvt\.?\s*ltd\.?|limited|ltd\.?|llp|inc\.?|corp\.?|corporation)\b/gi, ' ');

    // 4. Strip generic Indian MSME product/service tags if preceded by a brand name
    // e.g. "Custom Tshirts", "Custom Jerseys", "Printing", "Job Work", "Laser Cutting"
    clean = clean.replace(/\b(custom\s+t-?shirts?|custom\s+jerseys?|custom\s+hoodies?|custom\s+printing|t-?shirts?|jerseys?|hoodies?|printing|job\s*works?)\b/gi, ' ');

    // 5. Remove special punctuation and normalize whitespace
    clean = clean.replace(/[^\w\s&]/g, ' ').replace(/\s+/g, ' ').trim();

    // 6. If clean is still longer than 4 words, extract the core brand name (first 3 words)
    const words = clean.split(/\s+/).filter(Boolean);
    if (words.length > 3) {
      clean = words.slice(0, 3).join(' ');
    }

    return clean || name.split(',')[0].trim();
  }

  function getLinkedInUrl(name) {
    const clean = cleanCompanyNameForSearch(name);
    // Use LinkedIn Companies search with cleaned brand name for targeted company discovery
    return `https://www.linkedin.com/search/results/companies/?keywords=${encodeURIComponent(clean)}`;
  }

  function openCompanyDrawer(recordId) {
    const comp = App.companies.find(c => c.record_id === recordId || c.company_id === recordId);
    if (!comp) return;

    App.selectedCompany = comp;
    populateDrawerData(comp);

    const drawer = document.getElementById('company-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    if (drawer) drawer.classList.add('active');
    if (backdrop) backdrop.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeCompanyDrawer() {
    const drawer = document.getElementById('company-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    if (drawer) drawer.classList.remove('active');
    if (backdrop) backdrop.classList.remove('active');
    document.body.style.overflow = '';
    App.selectedCompany = null;
  }

  function switchDrawerTab(tab) {
    const tabOverview = document.getElementById('drawer-tab-overview');
    const tabManager = document.getElementById('drawer-tab-manager');
    const btnOverview = document.getElementById('tab-btn-overview');
    const btnManager = document.getElementById('tab-btn-manager');

    if (tab === 'manager') {
      if (tabOverview) tabOverview.style.display = 'none';
      if (tabManager) tabManager.style.display = 'flex';
      if (btnOverview) btnOverview.classList.remove('active');
      if (btnManager) btnManager.classList.add('active');
    } else {
      if (tabOverview) tabOverview.style.display = 'flex';
      if (tabManager) tabManager.style.display = 'none';
      if (btnOverview) btnOverview.classList.add('active');
      if (btnManager) btnManager.classList.remove('active');
    }
  }

  function saveCompanyEdits(e) {
    e.preventDefault();
    if (!App.selectedCompany) return;

    const recordId = App.selectedCompany.record_id;
    const saveBtn = document.getElementById('btn-save-drawer');
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving to Google Sheets...';
    }

    const updates = {
      manager_corrected_name: document.getElementById('edit-company-name').value.trim(),
      manager_corrected_phone: document.getElementById('edit-phone').value.trim(),
      manager_corrected_website: document.getElementById('edit-website').value.trim(),
      industrial_sector: document.getElementById('edit-sector').value.trim(),
      verification_status: document.getElementById('edit-verification').value,
      manager_category_override: document.getElementById('edit-tier').value,
      follow_up_status: document.getElementById('edit-followup-status') ? document.getElementById('edit-followup-status').value : 'New',
      lead_priority: document.getElementById('edit-lead-priority') ? document.getElementById('edit-lead-priority').value : 'Medium',
      assigned_to: document.getElementById('edit-assigned-to') ? document.getElementById('edit-assigned-to').value.trim() : '',
      next_follow_up_date: document.getElementById('edit-followup-date') ? document.getElementById('edit-followup-date').value : '',
      manager_notes: document.getElementById('edit-notes').value.trim()
    };

    google.script.run
      .withSuccessHandler((updated) => {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes to Google Sheets';
        }

        showToast('Company details saved successfully to Google Sheets.', 'success');
        
        Object.assign(App.selectedCompany, updates);
        App.selectedCompany.record_source = 'MANAGER_EDITED';
        closeCompanyDrawer();
        applyTableFilters();
      })
      .withFailureHandler((err) => {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes to Google Sheets';
        }
        showToast('Save failed: ' + err.message, 'error');
      })
      .updateCompany(recordId, updates);
  }

  function exportResultsAsCsv() {
    const records = (App.filteredCompanies && App.filteredCompanies.length > 0) 
      ? App.filteredCompanies 
      : (App.companies && App.companies.length > 0 ? App.companies : []);

    if (records.length === 0) {
      showToast('No companies available to export.', 'warning');
